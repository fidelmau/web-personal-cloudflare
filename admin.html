<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Fidel QA</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 600px;
            margin: 100px auto;
            padding: 2rem;
            background: var(--bg-surface);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }
        .form-control {
            width: 100%;
            padding: 0.8rem;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 8px;
            font-family: inherit;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent);
        }
        textarea.form-control {
            min-height: 150px;
            resize: vertical;
        }
        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
        }
        .alert.error {
            background: rgba(220, 38, 38, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
            display: block;
        }
        .alert.success {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
            display: block;
        }
        #dashboard { display: none; }
        .logout-btn {
            float: right;
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
        }
        .back-link {
            display: block;
            margin-bottom: 2rem;
            color: var(--accent);
            text-decoration: none;
        .json-editor-box {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .json-item {
            background: var(--bg-surface);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 0.5rem;
            border: 1px solid var(--border-color);
            position: relative;
        }
        .remove-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
    <!-- Cargar Supabase desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div class="admin-container">
            <a href="index.html" class="back-link">← Volver a la página principal</a>
            
            <div id="message-box"></div>

            <!-- Login Section -->
            <div id="login-section">
                <h2 class="section-title" style="font-size: 2rem; margin-bottom: 2rem;">Admin Login</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
                </form>
            </div>

            <!-- Dashboard Section -->
            <div id="dashboard">
                <button id="logout-btn" class="btn btn-secondary logout-btn">Cerrar Sesión</button>
                <h2 class="section-title" style="font-size: 2rem; margin-bottom: 2rem;">Editar Perfil</h2>
                
                <form id="edit-form">
                    <div class="form-group">
                        <label for="edit-name">Nombre</label>
                        <input type="text" id="edit-name" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="edit-title">Título Profesional</label>
                        <input type="text" id="edit-title" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="edit-tagline">Frase de Presentación (Tagline)</label>
                        <textarea id="edit-tagline" class="form-control"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="edit-about">Sobre Mí (Párrafo principal)</label>
                        <textarea id="edit-about" class="form-control"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="edit-email">Email de Contacto</label>
                        <input type="email" id="edit-email" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="edit-linkedin">Enlace de LinkedIn</label>
                        <input type="url" id="edit-linkedin" class="form-control">
                    </div>
                    
                    <h3 style="margin-top:2rem; margin-bottom:1rem; border-bottom:1px solid var(--border-color); padding-bottom:0.5rem;">Habilidades (Skills)</h3>
                    <div id="skills-editor" class="json-editor-box">
                        <!-- Skills will be injected here -->
                    </div>
                    <button type="button" class="btn btn-secondary" id="add-skill-btn" style="margin-bottom: 1.5rem; font-size:0.9rem;">+ Añadir Categoría de Habilidad</button>

                    <h3 style="margin-top:2rem; margin-bottom:1rem; border-bottom:1px solid var(--border-color); padding-bottom:0.5rem;">Experiencia Profesional</h3>
                    <div id="experience-editor" class="json-editor-box">
                        <!-- Experience will be injected here -->
                    </div>
                    <button type="button" class="btn btn-secondary" id="add-exp-btn" style="margin-bottom: 1.5rem; font-size:0.9rem;">+ Añadir Trabajo</button>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 1.2rem; font-size: 1.1rem;" id="save-btn">Guardar Todos Los Cambios</button>
                </form>
            </div>

        </div>
    </div>

    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
